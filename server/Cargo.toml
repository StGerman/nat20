[package]
name = "nat20_server"
version = "0.1.0"
edition = "2024"
description = "Headless JSON API around nat20_core: load a scene, list legal actions, submit decisions, read the event log."

[dependencies]
nat20_core = { path = "../core" }
hecs = { version = "0.10.5", features = ["std", "macros", "serde"] }
parry3d = { version = "0.24", features = ["serde-serialize"] }
rerecast = { version = "0.2.0", features = ["serialize"] }
uom = { version = "0.37.0", features = ["f32", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }

[lib]
name = "nat20_server"
path = "src/lib.rs"

[[bin]]
name = "nat20_server"
path = "src/main.rs"

[[bin]]
name = "nat20_duel"
path = "src/bin/duel.rs"
